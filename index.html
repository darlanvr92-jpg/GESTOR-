*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}

<header id="ttl">Gestão de Obras</header><main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const K='gestao_obras_v1',ECATS=['Capacetes','Óculos','Luvas','Botinas','Protetores auriculares','Respiradores','Cintos de segurança','Outros'];let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S=Object.assign({epis:[],eqp:[],eh:[],ecats:ECATS,obras:[],forn:[],oc:[],nf:[],par:[],mat:[],mov:[],hist:[],cats:['Material civil','Material elétrico','Material hidráulico','Material de pintura','Ferramentas','Outros'],uns:['UN','KG','G','M','M²','M³','L','ML','CX','PCT','SC','ROLO','PAR','JOGO'],seq:1},S);
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Não foi possível salvar neste navegador. Faça o backup agora (Mais > Backup).')}}
const $=s=>document.querySelector(s),uid=()=>S.seq++;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),num=n=>Number(n).toLocaleString('pt-BR',{maximumFractionDigits:3});
const cs=c=>(c/100).toFixed(2).replace('.',',');
const pm=t=>{t=String(t).replace(/[R$\s.]/g,'').replace(',','.');return /^\d+(\.\d{1,2})?$/.test(t)?Math.round(parseFloat(t)*100):null};
const pq=t=>{t=String(t).trim().replace(/\./g,'').replace(',','.');const n=Number(t);return t!==''&&isFinite(n)?n:null};
const brd=i=>i?i.split('-').reverse().join('/'):'';
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addD=(i,n)=>{const d=new Date(i+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const by=(a,id)=>S[a].find(x=>x.id==id),nm=(a,id)=>{const x=by(a,id);return x?(x.nome||x.fantasia||x.razao||x.descricao):''};
const hist=(a,t,ref)=>{S.hist.push({ts:new Date().toLocaleString('pt-BR'),a,t,ref})};
function cnpjOk(c){c=c.replace(/\D/g,'');if(c.length!=14||/^(\d)\1+$/.test(c))return false;const f=l=>{let s=0,p=l-7;for(let i=0;i<l;i++){s+=+c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return f(12)==c[12]&&f(13)==c[13]}
// cálculos
const nfsV=o=>S.nf.filter(n=>n.oc==o.id&&n.st=='Válida'),pars=n=>S.par.filter(p=>p.nf==n.id);
const fat=o=>nfsV(o).reduce((a,n)=>a+n.v,0),pago=o=>nfsV(o).flatMap(pars).filter(p=>p.pg).reduce((a,p)=>a+p.v,0);
const ocSt=o=>o.cancel?'Cancelada':fat(o)==0?'Aberta':fat(o)<o.v?'Parcialmente faturada':'Faturada';
const pSt=p=>p.pg?'Pago':p.venc<today()?'Vencido':p.venc==today()?'Vence hoje':'A vencer';
const cor=s=>({Pago:'--ok',Vencido:'--er','Vence hoje':'--wa','A vencer':'--b',Faturada:'--ok',Cancelada:'--er',Aberta:'--b','Parcialmente faturada':'--wa'}[s]||'--b');
const stk=m=>m.saldo<=0?['Zerado','--er']:m.saldo<m.min?['Abaixo do mínimo','--er']:m.saldo<=m.min*1.2?['Próximo do mínimo','--wa']:['Normal','--ok'];
const B=(t,c)=>`<span class=bd style="color:var(${c||cor(t)})">${esc(t)}</span>`;
// formulários
const opt=(l,f,blank)=>(blank?[['','—']]:[]).concat(l.map(x=>[x.id,f(x)]));
function form(title,fs,init,ok){init=init||{};const d=document.createElement('div');d.className='ov';
d.innerHTML=`<div class=md><h3>${title}</h3>${fs.map(([k,l,t,o,r])=>{let v=init[k]??'',i;
if(t=='s')i=`<select name=${k}>${(o||[]).map(x=>{x=Array.isArray(x)?x:[x,x];return`<option value="${esc(x[0])}" ${x[0]==v?'selected':''}>${esc(x[1])}</option>`}).join('')}</select>`;
else if(t=='V')i=`<div data-v="${k}"></div>`;else if(t=='a')i=`<textarea name=${k} rows=2>${esc(v)}</textarea>`;
else{if(t=='m'&&typeof v=='number')v=cs(v);i=`<input name=${k} type="${t=='d'?'date':'text'}" ${t=='m'||t=='n'?'inputmode=decimal':''} value="${esc(v)}">`}
return`<label>${l}${r?' *':''}</label>${i}`}).join('')}<p class=er id=fe></p><button class=bt id=fs>Salvar</button><button class="bt s" id=fc>Cancelar</button></div>`;
document.body.appendChild(d);d.querySelector('#fc').onclick=()=>d.remove();
fs.filter(f=>f[2]=='V').forEach(([k,l,t,o])=>{const box=d.querySelector(`[data-v="${k}"]`),src=d.querySelector(`[name=${o}]`),tot=d.querySelector('[name=v]'),pd=init[k]||[],pv=init[k+'_v']||[];let manual=pv.length>0,cnt=pd.length;
const total=()=>pm(tot?tot.value:'')||0;
const upd=()=>{const sm=[...box.querySelectorAll('[data-p]')].reduce((a,i)=>a+(pm(i.value)||0),0),T=total(),df=T-sm,el=box.querySelector('.sm');if(el){el.textContent=`Soma das parcelas: ${brl(sm)} · Valor da NF: ${brl(T)} · Diferença: ${brl(df)}`;el.style.color=df==0?'var(--ok)':'var(--er)'}};
const draw=()=>{const od=[...box.querySelectorAll('[data-d]')].map(i=>i.value),ov=[...box.querySelectorAll('[data-p]')].map(i=>i.value),n=Math.max(0,Math.min(60,parseInt(src.value)||0));
if(n!=cnt)manual=false;cnt=n;const T=total(),base=n?Math.floor(T/n):0;let prev='',h='';
for(let i=0;i<n;i++){let dt=od[i]??pd[i]??'';if(!dt)dt=prev?addD(prev,30):addD(today(),30);prev=dt;
const vl=manual?(ov[i]??(pv[i]!=null?cs(pv[i]):'')):cs(i==0?T-base*(n-1):base);
h+=`<label>Parcela ${i+1} de ${n}: vencimento e valor (R$) *</label><div style="display:flex;gap:8px"><input type=date data-d value="${dt}"><input data-p inputmode=decimal value="${vl}"></div>`}
box.innerHTML=h+'<p class=sm style="font-size:13px"></p>';box.querySelectorAll('[data-p]').forEach(i=>i.oninput=()=>{manual=true;upd()});upd()};
draw();src.oninput=draw;src.onchange=draw;if(tot){tot.oninput=draw;tot.onchange=draw}});
d.querySelector('#fs').onclick=()=>{const v={};for(const[k,l,t,o,r]of fs){if(t=='V'){v[k]=[...d.querySelectorAll(`[data-v="${k}"] [data-d]`)].map(i=>i.value);v[k+'_v']=[...d.querySelectorAll(`[data-v="${k}"] [data-p]`)].map(i=>pm(i.value));continue}let x=d.querySelector(`[name=${k}]`).value.trim();
if(r&&!x)return fe(`Preencha: ${l}.`);if(t=='m'){x=x===''?null:pm(x);if(x===null&&r||x===null&&d.querySelector(`[name=${k}]`).value.trim())return fe(`Valor inválido em: ${l}.`)}
if(t=='n'){const n=pq(x);if(x!==''&&n===null)return fe(`Número inválido em: ${l}.`);x=n}v[k]=x}
const e=ok(v);if(e)return fe(e);d.remove();render()};function fe(m){d.querySelector('#fe').textContent=m}}
function show(t,txt){const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class=md><h3>${t}</h3><textarea rows=12 readonly>${esc(txt)}</textarea><button class=bt id=cp>Copiar texto</button><button class="bt s" id=cl>Fechar</button></div>`;document.body.appendChild(d);const ta=d.querySelector('textarea');
d.querySelector('#cp').onclick=async()=>{ta.select();try{await navigator.clipboard.writeText(txt);alert('Copiado.')}catch(e){alert('Texto selecionado. Use Copiar no menu do celular.')}};d.querySelector('#cl').onclick=()=>d.remove()}
let R={t:'painel'},OB='',CAT='',Q='',ST='',TAB='resumo';
const go=(t,id,tab)=>{R={t,id};TAB=tab||'resumo';render();scrollTo(0,0)};
function ask(m,fn){const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class=md><h3>Confirmar</h3><p>${esc(m)}</p><button class=bt id=ys>Sim</button><button class="bt s" id=no>Não</button></div>`;document.body.appendChild(d);d.querySelector('#no').onclick=()=>d.remove();d.querySelector('#ys').onclick=()=>{d.remove();fn()}}
window.alert=m=>{const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class=md><h3>Aviso</h3><p>${esc(m)}</p><button class=bt>OK</button></div>`;document.body.appendChild(d);d.querySelector('button').onclick=()=>d.remove()};
// ---- Painel
function vPainel(){const ocs=S.oc.filter(o=>!o.cancel&&(!OB||o.obra==OB)),ids=new Set(ocs.map(o=>o.id)),t=today();
const tot=ocs.reduce((a,o)=>a+o.v,0),f=ocs.reduce((a,o)=>a+fat(o),0),ps=S.nf.filter(n=>n.st=='Válida'&&ids.has(n.oc)).flatMap(pars).filter(p=>!p.pg),sm=a=>brl(a.reduce((x,p)=>x+p.v,0));
const mv=S.mov.filter(m=>m.data>=addD(t,-7)&&(!OB||m.obra==OB)).length,C=(l,v,c)=>`<div class=cd><small>${l}</small><b ${c?`style="color:var(${c})"`:''}>${v}</b></div>`;
const low=S.mat.concat(S.epis).filter(m=>m.saldo<m.min).length;
return`<select onchange="OB=this.value;render()"><option value="">Todas as obras</option>${S.obras.map(o=>`<option value=${o.id} ${o.id==OB?'selected':''}>${esc(o.nome)}</option>`).join('')}</select>
<div class=g>${C('Ordens de Compra',ocs.length)}${C('Valor total das OCs',brl(tot))}${C('Valor faturado',brl(f))}${C('Restante das OCs',brl(tot-f))}${C('Boletos pendentes',sm(ps))}${C('Boletos vencidos',sm(ps.filter(p=>p.venc<t)),ps.some(p=>p.venc<t)&&'--er')}${C('Vencem em 7 dias',sm(ps.filter(p=>p.venc>=t&&p.venc<=addD(t,7))),'--wa')}${C('Materiais cadastrados',S.mat.length)}${C('Abaixo do mínimo',low,low&&'--er')}${C('Movimentações (7 dias)',mv)}</div>
<h3 style="margin-top:16px">Atalhos</h3><button class=bt onclick="ocForm()">Nova OC</button><button class=bt onclick="nfForm()">Nova NF</button><button class=bt onclick="movForm('ENTRADA')">Entrada de estoque</button><button class=bt onclick="movForm('SAIDA')">Saída de estoque</button><button class="bt s" onclick="matForm()">Novo material</button><button class="bt s" onclick="exportBoletos()">Relatório de boletos em aberto (Excel)</button>
<p class=mu>O filtro de obra não se aplica à contagem de materiais.</p>`}
// ---- OCs
function ocForm(o){if(!S.obras.length||!S.forn.length)return alert('Cadastre ao menos uma obra e um fornecedor primeiro (aba Cadastros).');
form(o?'Editar OC':'Nova OC',[['numero','Número da OC','t',0,1],['obra','Obra','s',opt(S.obras,x=>x.nome),1],['forn','Fornecedor','s',opt(S.forn,x=>x.fantasia||x.razao),1],['data','Data','d',0,1],['descricao','Descrição','t'],['cc','Centro de custo','t'],['v','Valor contratado (R$)','m',0,1],['resp','Responsável','t'],['obs','Observações','a']],o||{data:today()},v=>{v.obra=+v.obra;v.forn=+v.forn;
if(S.oc.some(x=>x.id!=o?.id&&x.obra==v.obra&&x.numero.toLowerCase()==v.numero.toLowerCase()))return'Já existe uma OC com este número nesta obra.';
if(o){Object.assign(o,v);hist('OC editada',v.numero,o.id)}else{const n={id:uid(),...v};S.oc.push(n);hist('OC criada',v.numero,n.id)}save()})}
function vOC(){const l=S.oc.filter(o=>(!OB||o.obra==OB)&&(!ST||ocSt(o)==ST)&&(o.numero+o.descricao+nm('forn',o.forn)).toLowerCase().includes(Q.toLowerCase()));
return`<button class=bt onclick="ocForm()">+ Nova OC</button><input placeholder="Pesquisar OC, fornecedor ou descrição" value="${esc(Q)}" onchange="Q=this.value;render()">
<select onchange="ST=this.value;render()"><option value="">Todos os status</option>${['Aberta','Parcialmente faturada','Faturada','Cancelada'].map(s=>`<option ${s==ST?'selected':''}>${s}</option>`).join('')}</select>
${l.map(o=>`<div class=cd onclick="go('oc',${o.id})"><b>OC ${esc(o.numero)}</b> ${B(ocSt(o))}<div class=mu>${esc(nm('obras',o.obra))} · ${esc(nm('forn',o.forn))}</div><div>${brl(o.v)} · saldo ${brl(o.v-fat(o))}</div></div>`).join('')||'<p class=mu>Nenhuma OC encontrada.</p>'}`}
function vOCd(){const o=by('oc',R.id),f=fat(o),nfs=S.nf.filter(n=>n.oc==o.id),pp=nfsV(o).flatMap(pars);
const tabs=['resumo','nfs','pagamentos','histórico'].map(t=>`<button class="chip ${t==TAB?'on':''}" onclick="TAB='${t}';render()">${t}</button>`).join('');let b='';
if(TAB=='resumo')b=`<div class=cd>${[['Obra',nm('obras',o.obra)],['Fornecedor',nm('forn',o.forn)],['Data',brd(o.data)],['Valor original',brl(o.v)],['NFs válidas',brl(f)],['Saldo para faturar',brl(o.v-f)],['Total pago',brl(pago(o))],['Total pendente',brl(f-pago(o))],['Descrição',o.descricao],['Centro de custo',o.cc],['Responsável',o.resp],['Observações',o.obs]].map(([a,c])=>`<div class=rw><span class=mu>${a}</span><span>${esc(c)}</span></div>`).join('')}</div><button class="bt s" onclick="ocForm(by('oc',${o.id}))">Editar OC</button>${o.cancel?'':`<button class="bt r" onclick="cancelOC(${o.id})">Cancelar OC</button>`}`;
if(TAB=='nfs')b=(o.cancel?'':`<button class=bt onclick="nfForm(${o.id})">+ Nova NF</button>`)+(nfs.map(n=>`<div class=cd><b>NF ${esc(n.numero)}${n.serie?'/'+esc(n.serie):''}</b> ${B(n.st,n.st=='Válida'?'--ok':'--er')}<div>${brl(n.v)} · emissão ${brd(n.data)}</div>${n.st=='Válida'?`<button class="bt m s" onclick="nfEdit(${n.id})">Editar NF</button><button class="bt m r" onclick="cancelNF(${n.id})">Cancelar NF</button>`:''}</div>`).join('')||'<p class=mu>Nenhuma NF.</p>');
if(TAB=='pagamentos')b=pp.map(p=>{const n=by('nf',p.nf);return`<div class=cd><b>NF ${esc(n.numero)} · parcela ${p.n}</b> ${B(pSt(p))}<div>${brl(p.v)} · vence ${brd(p.venc)}${p.pg?' · pago em '+brd(p.pg):''}${p.bol?' · boleto '+esc(p.bol):''}${p.forma?' · '+esc(p.forma):''}</div><button class="bt m s" onclick="parcEd(${p.id})">Editar vencimento/boleto</button>${p.pg?`<button class="bt m s" onclick="desPagar(${p.id})">Desfazer pagamento</button>`:`<button class="bt m" onclick="pagar(${p.id})">Registrar pagamento</button>`}</div>`}).join('')||'<p class=mu>Sem parcelas.</p>';
if(TAB=='histórico')b=S.hist.filter(h=>h.ref==o.id).reverse().map(h=>`<div class=cd><b>${esc(h.a)}</b><div class=mu>${h.ts} · ${esc(h.t)}</div></div>`).join('')||'<p class=mu>Sem registros.</p>';
return`<button class="bt s" onclick="go('oc')">← Voltar</button><h3>OC ${esc(o.numero)} ${B(ocSt(o))}</h3><button class=bt onclick="exportOC(${o.id})">Exportar OC completa em Excel</button>${tabs}${b}`}
function nfForm(oid){const ocs=S.oc.filter(o=>!o.cancel);if(!ocs.length)return alert('Cadastre uma OC primeiro.');
form('Nova Nota Fiscal',[['oc','OC','s',opt(ocs,o=>'OC '+o.numero+' · '+nm('forn',o.forn)),1],['numero','Número da NF','t',0,1],['serie','Série','t'],['chave','Chave de acesso (opcional)','t'],['data','Data de emissão','d',0,1],['v','Valor da NF (R$)','m',0,1],['forma','Forma de pagamento','s',['Parcelado em boletos','À vista antecipado (já pago, sem vencimento)']],['np','Nº de parcelas (se parcelado)','n'],['dv','Parcelas: vencimento e valor (ignorado se à vista)','V','np'],['dpg','Data do pagamento (se à vista; vazio = data de emissão)','d'],['descricao','Descrição','t'],['aut','Autorizar faturamento acima da OC?','s',['Não','Sim']],['obs','Observações','a']],{oc:oid,data:today(),np:1,v1:addD(today(),30)},v=>{
const o=by('oc',v.oc);if(!(v.v>0))return'O valor da NF deve ser maior que zero.';const av=(v.forma||'').startsWith('À vista'),np=av?1:Math.floor(v.np);if(!av&&(!(np>=1&&np<=60)||v.dv.length!=np||v.dv.some(x=>!x)))return'Parcelado: informe de 1 a 60 parcelas e a data de vencimento de cada uma.';if(!av){if(v.dv_v.some(x=>x==null||x<=0))return'Informe o valor de cada parcela (maior que zero).';const sm=v.dv_v.reduce((a,b)=>a+b,0);if(sm!=v.v)return`A soma das parcelas (${brl(sm)}) deve ser igual ao valor da NF (${brl(v.v)}). Diferença: ${brl(v.v-sm)}.`;}
if(S.nf.some(n=>n.forn==o.forn&&n.numero==v.numero&&(n.serie||'')==(v.serie||'')&&n.st=='Válida'))return'Já existe NF com este número e série para o fornecedor.';
const exc=fat(o)+v.v-o.v;if(exc>0&&v.aut!='Sim')return`Esta NF ultrapassa o valor da OC em ${brl(exc)}. Para lançar, escolha Sim em Autorizar faturamento acima da OC.`;
