function usrEd(id){const u=USR.find(x=>x.id==id);if(!u)return;form('Editar usuário',[['nome','Nome','t',0,1],['email','E-mail de login','t',0,1]],{nome:u.nome||'',email:u.email||''},v=>{const e=toEmail(v.email);if(!emOk(e))return'Informe um e-mail válido.';if(!v.nome.trim())return'Informe o nome.';
(async()=>{const{error}=await tentar(()=>sb.rpc(isAdm()?'admin_editar_usuario':'obra_adm_editar',{p_id:id,p_nome:v.nome.trim(),p_email:e}),m=>{try{$('#fe').textContent=m}catch(x){}},6);alert(error?(/já existe/.test(error.message||'')?'Este e-mail já está em uso por outro usuário.':'Não foi possível salvar: '+msgErr(error)):'Dados atualizados.'+(e!=(u.email||'').toLowerCase()?' O usuário deve entrar com o novo e-mail.':''));USR=null;render()})()})}
async function usrPapel(id,papel){const{error}=await sb.from('perfis').update({papel}).eq('id',id);if(error)alert(msgErr(error));USR=null;render()}
async function usrAtivo(id,ativo){const{error}=await(isAdm()?sb.from('perfis').update({ativo}).eq('id',id):sb.rpc('obra_adm_ativo',{p_id:id,p_ativo:ativo}));if(error)alert(msgErr(error));USR=null;render()}
function usrSenha(id){form('Redefinir senha',[['s','Nova senha (mínimo 8 caracteres)','t',0,1]],{},v=>{if(v.s.length<8)return'A senha precisa ter ao menos 8 caracteres.';sb.rpc(isAdm()?'redefinir_senha':'obra_adm_senha',{p_id:id,p_senha:v.s}).then(({error})=>alert(error?'Não foi possível redefinir: '+msgErr(error):'Senha redefinida. Informe a nova senha ao usuário.'))})}
function novoUsrOA(){const ob=obrasUsr(),N=[['nenhum','Sem acesso'],['ver','Somente ver'],['editar','Ver e editar']];form('Novo usuário da obra',[['nome','Nome','t',0,1],['usuario','E-mail do usuário (real)','t',0,1],['senha','Senha inicial (mínimo 8 caracteres)','t',0,1],['obra','Obra','s',ob.map(o=>[o.id,o.nome]),1],['oc','Ordens de Compra','s',N],['nf','Notas Fiscais e boletos','s',N],['estoque','Estoque (materiais, EPIs e equipamentos)','s',N]],{obra:ob[0]&&ob[0].id,oc:'ver',nf:'nenhum',estoque:'ver'},v=>{
if(!emOk(v.usuario.trim()))return'Informe um e-mail válido.';if(v.senha.length<8)return'A senha precisa ter ao menos 8 caracteres.';
(async()=>{const{error}=await tentar(()=>sb.rpc('obra_adm_criar',{p_email:toEmail(v.usuario),p_senha:v.senha,p_nome:v.nome,p_obra:+v.obra,p_perm:{oc:v.oc,nf:v.nf,estoque:v.estoque}}),m=>{try{$('#fe').textContent=m}catch(e){}},8);
alert(error?(/já existe|already/.test(error.message||'')?'Este e-mail já tem cadastro. Peça ao administrador geral para liberar a obra para ele.':'Não foi possível criar: '+msgErr(error)):'Usuário criado e ativo nesta obra. Informe o e-mail e a senha inicial à pessoa.');USR=null;render()})()})}
function novoUsr(){if(!isAdm())return novoUsrOA();form('Novo usuário',[['nome','Nome','t',0,1],['usuario','E-mail do usuário (real)','t',0,1],['senha','Senha inicial (mínimo 8 caracteres)','t',0,1],['papel','Perfil','s',[['consulta','Usuário (acesso por obra)'],['administrador','Administrador']],1]],{papel:'consulta'},v=>{
if(!emOk(v.usuario.trim()))return'Informe um e-mail válido.';if(v.senha.length<8)return'A senha precisa ter ao menos 8 caracteres.';
(async()=>{const{data:novoId,error}=await tentar(()=>sb.rpc('admin_criar_usuario',{p_email:toEmail(v.usuario),p_senha:v.senha,p_nome:v.nome,p_papel:v.papel}),m=>{try{$('#fe').textContent=m}catch(e){}},8);
alert(error?(/já existe|already/.test(error.message||'')?'Este e-mail já tem cadastro.':'Não foi possível criar: '+msgErr(error)):'Usuário criado e ativo. Informe o e-mail e a senha inicial à pessoa.'+(v.papel=='administrador'?'':' Agora marque as obras que ele poderá acessar.'));USR=null;if(!error&&v.papel!='administrador'&&novoId){await vUsrLoad();usrPerm(novoId)}else render()})()})}
async function boot(){if(!window.supabase){$('#app').innerHTML='<div class=cd>Não foi possível carregar o sistema de login. Verifique a internet e recarregue.</div>';return}
sb=supabase.createClient(SB_URL,SB_KEY);const{data}=await sb.auth.getSession();if(data.session)await entrar(data.session.user);else telaLogin()}

boot();
